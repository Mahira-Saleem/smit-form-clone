<!DOCTYPE html>
<html lang="en">
      <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>form</title>
            <link rel="stylesheet" href="style.css">
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
      </head>
<body>
      <div class="nav-main-div">
            <div class="second-main-div">
            <img src="image/smit-image.png" alt="">
            <nav>
                  <a href="#" class="anchor">Home</a>
                  <a href="#" class="anchor">About</a>
                  <select  style="color: rgb(84, 84, 84);"><option>Courses</option></select>
                  <a href="#" class="anchor">Courses</a>
                  <a href="#" class="anchor">Result Check</a>
                  <button class="enroll-btn"> Enroll Now <i class="fa-solid fa-square-arrow-up-right" style="color: white;"></i></button>
            </nav>   
      </div> 
</div>

<div class="linear-div"> 
         <div class="sec-linear-div">
              <a href="#"><i class="fa-solid fa-graduation-cap" style="color: rgb(255, 255, 255);"></i></a>
              <i class="fa-solid fa-greater-than" style="color: rgb(190, 192, 199);"></i>
              <span style="color: white;"> Enroll Now</span>
              <h1>Registration Form</h1>
              <p>Start your journey towards excellence. Fill out the form to apply for our courses</p>
            </div>
      </div>
<!-- next mini div -->
      <div class="mini-div ">
            <div class="registration"><i class="fa-brands fa-wpforms" style="color: rgb(255, 255, 255);"></i>  Resgistratuion Form</div>
            <div class="ID-card"> <i class="fa-regular fa-address-card" style="color: rgb(0, 0, 0);"></i>  Download ID Card</div>
            <div class="result"> <i class="fa-regular fa-file-lines" style="color: rgb(7, 7, 7);"></i>  Result</div>
      </div>
      
 <div class="form-container">
        <h2 class="section-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                <circle cx="12" cy="10" r="3"></circle>
            </svg>
            Location & Course Details
        </h2>

        <form class="form-grid">
            <!-- Select Country -->
            <div class="form-group">
                <label class="form-label">Select Country<span class="required">*</span></label>
                <div class="select-wrapper">
                    <select class="form-select">
                        <option selected disabled>Select country</option>
                        <option value="pak">Pakistan</option>
                        <option value="usa">USA</option>
                        <option value="japan">Japan</option>

                    </select>
                </div>
            </div>

            <!-- Select class preference -->
            <div class="form-group">
                <label class="form-label">Select class preference<span class="required">*</span></label>
                <div class="select-wrapper">
                    <select class="form-select">
                        <option selected disabled>Select class preference</option>
                        <option value="onsite">Onsite</option>
                        <option value="online">Online</option>
                    </select>
                </div>
            </div>

            <!-- Select Gender -->
            <div class="form-group">
                <label class="form-label">Select Gender<span class="required">*</span></label>
                <div class="select-wrapper">
                    <select class="form-select">
                        <option selected disabled>Select gender</option>
                        <option value="male">Male</option>
                        <option value="femlae">Female</option>
                        <option value="others">Others</option>
                    </select>
                </div>
            </div>

            <!-- Select City -->
            <div class="form-group">
                <label class="form-label">Select City <span class="required">*</span></label>
                <div class="select-wrapper">
                    <select class="form-select">
                        <option selected disabled>Select country first</option>
                        <option value="karachi">Karachi</option>
                        <option value="Islamabad">Islamabad</option>
                        <option value="Lahore">Lahore</option>
                        <option value="Multan">Multan</option>
                        <option value="Sialkot">Sialkot</option>
                        <option value="Balochistan">Balochistan</option>
                        <option value="Hyderabad">Hyderabad</option>
                        <option value="Kashmir">Kashmir</option>
                    </select>
                </div>
            </div>

            <!-- Select Course -->
            <div class="form-group">
                <label class="form-label">Select Course<span class="required">*</span></label>
                <div class="select-wrapper">
                    <select class="form-select">
                        <option selected disabled>No course available</option>
                        <option value="WMA">Modren Web Development</option>
                        <option value="ai">Ai and Data Science</option>
                        <option value="graphic">Graphic Designing</option>
                        <option value="solar">Solar System Installation</option>
                        <option value="fir">Fire Alarm System Installation</option>
                        <option value="ui-ux">UI UX Design With AI</option>
                    </select>
                </div>
            </div>

            <!-- Select Campus -->
            <div class="form-group">
                <label class="form-label">Select Campus</label>
                <div class="select-wrapper">
                    <select class="form-select">
                        <option selected disabled>Select course first</option>
                        <option value="Aliabad">Aliabad</option>
                        <option value="Nazimabad">Nazimabad</option>
                        <option value="gulsan">gulshan-e-iqbal</option>
                        <option value="svit">SVTI Gulshan Campus</option>
                    </select>
                </div>
            </div>
        </form>
    </div>
      
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
